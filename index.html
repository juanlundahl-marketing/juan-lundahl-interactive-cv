  <!-- Apply saved theme before paint (no flash). Storage may be blocked: guarded. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('jl-theme');
        if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
        var l = localStorage.getItem('jl-lang');
        if (l === 'es' || l === 'en' || l === 'de') d.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>

  <!-- Shared ornament sprite (original drawings, filete-inspired; no copied work).
       Use anywhere: <svg class="filete" aria-hidden="true"><use href="#f-rule"/></svg>
       #f-corner (64x64 corner flourish), #f-rule (260x26 rule), #f-flick (44x22, gold, for dark plates). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="f-corner" viewBox="0 0 64 64">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 60 C6 40 14 24 30 14 C42 7 56 8 58 18 C60 26 50 30 46 24 C43 20 47 16 50 18" style="stroke:var(--gold)" stroke-width="1.6"/>
          <path d="M10 44 C4 34 8 24 20 20 C22 30 18 38 10 44 Z" style="fill:var(--celeste);stroke:var(--celeste-ink)" fill-opacity=".4" stroke-width="1"/>
          <path d="M12 41 C14 33 16 28 19 23" style="stroke:var(--celeste-ink)" stroke-width=".8"/>
          <path d="M24 17 C27 25 34 29 41 27 C37 21 31 17 24 17 Z" style="fill:var(--ochre);stroke:var(--gold)" fill-opacity=".45" stroke-width="1"/>
          <path d="M4 60 H22 C26 60 28 57 26 55 C24 53 21 55 23 57" style="stroke:var(--gold)" stroke-width="1.3"/>
        </g>
        <circle cx="4" cy="60" r="2.6" style="fill:var(--oxblood)"/>
      </symbol>
      <symbol id="f-rule" viewBox="0 0 260 26" preserveAspectRatio="xMinYMid meet">
        <g fill="none" stroke-linecap="round" style="stroke:var(--gold)" stroke-width="1.3">
          <path d="M0 13 H92"/><path d="M168 13 H260"/>
          <path d="M92 13 C98 3 110 3 110 10 C110 15 104 15 104 11"/>
          <path d="M168 13 C162 23 150 23 150 16 C150 11 156 11 156 15"/>
        </g>
        <path d="M118 13 C122 6 128 5 130 13 C128 21 122 20 118 13 Z" style="fill:var(--celeste);stroke:var(--celeste-ink)" fill-opacity=".45" stroke-width="1"/>
        <path d="M142 13 C138 6 132 5 130 13 C132 21 138 20 142 13 Z" style="fill:var(--ochre);stroke:var(--gold)" fill-opacity=".45" stroke-width="1"/>
        <circle cx="130" cy="13" r="2.3" style="fill:var(--oxblood)"/>
      </symbol>
      <symbol id="f-flick" viewBox="0 0 44 22">
        <g fill="none" stroke="#EBC66E" stroke-width="1.5" stroke-linecap="round"><path d="M42 11 H18 C10 11 4 6 8 3 C11 1 14 4 12 6"/><path d="M30 11 C26 17 18 19 16 15"/></g>
        <path d="M22 11 C25 6 30 6 32 11 C30 15 25 15 22 11 Z" fill="#EBC66E" fill-opacity=".35" stroke="#EBC66E" stroke-width=".9"/>
      </symbol>
    </defs>
  </svg>
